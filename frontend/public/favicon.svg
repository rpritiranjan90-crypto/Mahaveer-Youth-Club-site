<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Shield/Rounded Square -->
  <rect width="92" height="92" x="4" y="4" rx="22" fill="url(#bgGrad)" stroke="#FDE68A" stroke-width="2" />
  <circle cx="50" cy="50" r="36" fill="url(#halo)" />
  <!-- Sacred Om/Ganesha Symbol -->
  <text x="50%" y="58%" text-anchor="middle" dominant-baseline="middle" fill="#FFFDF8" font-family="'Rozha One', 'Cinzel', serif" font-size="48" font-weight="900" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">ॐ</text>
  <!-- Decorative Dots -->
  <circle cx="50" cy="18" r="3" fill="#FEF08A" />
</svg>
