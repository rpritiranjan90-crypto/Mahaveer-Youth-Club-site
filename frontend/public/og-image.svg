<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 6" />

  <!-- Club Emblem -->
  <g transform="translate(100, 190)">
    <rect width="130" height="130" rx="30" fill="url(#goldGrad)" />
    <text x="65" y="78" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-family="'Rozha One', serif" font-size="70" font-weight="bold">ॐ</text>
  </g>

  <!-- Club Title & Heading -->
  <text x="270" y="235" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="4">OFFICIAL FESTIVAL &amp; WELFARE PORTAL</text>
  <text x="270" y="295" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">MAHAVEER YOUTH CLUB</text>
  <text x="270" y="345" fill="#F97316" font-family="'Inter', sans-serif" font-size="26" font-weight="600">Ganesh Utsav 2026 • Community Welfare • Transparent Donations</text>

  <!-- Divider -->
  <line x1="100" y1="410" x2="1100" y2="410" stroke="#334155" stroke-width="2" />

  <!-- Feature Pills -->
  <g transform="translate(100, 460)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="50" rx="25" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="110" y="31" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="600">🪔 10-Day Puja Schedule</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="50" rx="25" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="350" y="31" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="600">📷 Devotee Photo Gallery</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="240" height="50" rx="25" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="600" y="31" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="600">🩸 Blood Donation Drives</text>

    <!-- Pill 4 -->
    <rect x="740" y="0" width="260" height="50" rx="25" fill="url(#goldGrad)" />
    <text x="870" y="31" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="700">💳 Official UPI QR Donate</text>
  </g>
</svg>
